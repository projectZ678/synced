<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · black & white animated</title>
  <style>
    /* reset & base – pure black & white */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
      padding: 1.5rem;
      margin: 0;
    }

    /* main card – monochrome, subtle depth */
    .error-container {
      background: #fff;
      color: #000;
      max-width: 720px;
      width: 100%;
      padding: 3rem 2.5rem;
      border-radius: 3rem;
      box-shadow: 0 20px 40px rgba(255, 255, 255, 0.08), 
                  0 8px 20px rgba(0, 0, 0, 0.8);
      text-align: center;
      transition: box-shadow 0.2s;
      border: 1px solid #222;
    }

    /* animated 404 – pure css, black & white rhythm */
    .glitch-404 {
      font-size: 8rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -4px;
      color: #000;
      display: inline-block;
      position: relative;
      margin-bottom: 0.25rem;
      animation: pulseGlitch 2.8s infinite ease-in-out;
      text-shadow: 0 0 2px #fff, 0 0 6px #aaa;
    }

    /* ghost layers for extra flicker (pure b&w) */
    .glitch-404::before,
    .glitch-404::after {
      content: "404";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      mix-blend-mode: difference;
    }

    .glitch-404::before {
      color: #fff;
      z-index: -1;
      animation: glitchShift 1.6s infinite linear alternate-reverse;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #fff;
    }

    .glitch-404::after {
      color: #000;
      z-index: -2;
      animation: glitchShift 2.2s infinite linear alternate;
      text-shadow: -3px 0 0 #fff, 3px 0 0 #000;
    }

    /* subtle floating for the whole 404 */
    @keyframes pulseGlitch {
      0% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.03) rotate(0.6deg); }
      100% { transform: scale(1) rotate(-0.3deg); }
    }

    @keyframes glitchShift {
      0% { transform: translate(-3px, 2px) skewX(0deg); }
      20% { transform: translate(4px, -2px) skewX(2deg); }
      40% { transform: translate(-5px, 1px) skewX(-1deg); }
      60% { transform: translate(6px, -3px) skewX(3deg); }
      80% { transform: translate(-2px, 3px) skewX(-2deg); }
      100% { transform: translate(3px, -1px) skewX(1deg); }
    }

    /* message – animated fade + slide */
    .message {
      font-size: 1.8rem;
      font-weight: 500;
      letter-spacing: -0.5px;
      margin: 0.5rem 0 1rem 0;
      color: #000;
      animation: fadeSlide 2s infinite alternate ease-in-out;
      text-shadow: 0 0 1px #fff;
    }

    @keyframes fadeSlide {
      0% { opacity: 0.6; transform: translateY(0px); letter-spacing: 0px; }
      100% { opacity: 1; transform: translateY(-6px); letter-spacing: 2px; }
    }

    /* sub-message */
    .sub-message {
      font-size: 1.1rem;
      font-weight: 300;
      margin: 0.8rem 0 2rem 0;
      color: #222;
      border-top: 1px solid #aaa;
      border-bottom: 1px solid #aaa;
      padding: 0.8rem 0;
      display: inline-block;
      letter-spacing: 0.5px;
      animation: borderPulse 3s infinite;
    }

    @keyframes borderPulse {
      0% { border-color: #555; opacity: 0.7; }
      50% { border-color: #fff; opacity: 1; }
      100% { border-color: #222; opacity: 0.8; }
    }

    /* home link – pure monochrome with hover animation */
    .home-link {
      display: inline-block;
      margin-top: 0.8rem;
      padding: 0.9rem 2.8rem;
      background: #000;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.3rem;
      letter-spacing: 1px;
      border-radius: 60px;
      border: 2px solid #fff;
      transition: all 0.3s ease;
      box-shadow: 0 4px 0 #fff;
      position: relative;
      overflow: hidden;
    }

    .home-link::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      transform: translateX(-100%) skewX(-20deg);
      transition: transform 0.4s ease;
      z-index: -1;
    }

    .home-link:hover {
      color: #000;
      background: #fff;
      border-color: #000;
      box-shadow: 0 8px 0 #000;
      transform: translateY(-4px);
    }

    .home-link:hover::after {
      transform: translateX(100%) skewX(-20deg);
    }

    /* animated dots – pure b&w loading flavor */
    .dots {
      display: inline-flex;
      gap: 8px;
      margin-top: 1.2rem;
      justify-content: center;
      filter: grayscale(1);
    }

    .dot {
      width: 12px;
      height: 12px;
      background: #000;
      border-radius: 50%;
      animation: dotBounce 1.6s infinite ease-in-out;
      border: 1px solid #fff;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotBounce {
      0%, 100% { transform: translateY(0); background: #000; }
      50% { transform: translateY(-12px); background: #fff; box-shadow: 0 0 10px #fff; }
    }

    /* extra subtle movement for container */
    .error-container {
      animation: containerFloat 6s infinite alternate ease-in-out;
    }

    @keyframes containerFloat {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }

    /* responsive */
    @media (max-width: 480px) {
      .glitch-404 {
        font-size: 5rem;
      }
      .message {
        font-size: 1.4rem;
      }
      .home-link {
        padding: 0.7rem 2rem;
        font-size: 1.1rem;
      }
      .error-container {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="error-container">
    <!-- animated glitch 404 -->
    <div class="glitch-404" aria-label="404 error">404</div>

    <!-- message with fade-slide -->
    <div class="message">page not found</div>

    <!-- sub message with border pulse -->
    <div class="sub-message">the requested resource could not be found</div>

    <!-- home link (animated) -->
    <a href="#" class="home-link" aria-label="go back home">⟵ home</a>

    <!-- animated dots (black & white) -->
    <div class="dots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
