    }
    .intro-text {

      font-style: italic;

      opacity: 0;

      text-shadow: 0 0 40px rgba(255, 160, 200, 0.25);

    @keyframes introFadeIn {

    /* ── Main layout ── */

      display: flex;

      width: 100%;

      z-index: 1;
      gap: 1rem;
      align-items: stretch;
      opacity: 0;
      transition: opacity 1s ease 0.2s;
    }

    }

    /* Vertical sidebar */
    .sidebar {

      flex-direction: column;
      gap: 0.45rem;
      background: rgba(16, 12, 18, 0.8);
      backdrop-filter: blur(16px);
      border-radius: 1.9rem;

      border: 1px solid rgba(255, 170, 210, 0.09);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.6);

    .sidebar-btn {

      height: 42px;

      height: 18px;

    .counter-unit .label {
      font-size: 0.42rem;

      text-transform: uppercase;

    .counter-since {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;

    .foot-note {

      font-weight: 200;

    @media (max-width: 640px) {

  <script>
    // Global falling pink stars
    (function () {
      const canvas = document.getElementById('stars-canvas');
      const ctx = canvas.getContext('2d');
      let width, height, particles = [];
      const MAX = 85;

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
      }
      window.addEventListener('resize', resize);
      resize();

      class Star {
        constructor() { this.reset(); }
        reset() {
          this.x = Math.random() * width;
          this.y = -10 - Math.random() * 40;
          this.size = 1 + Math.random() * 2.1;
          this.speed = 0.22 + Math.random() * 0.48;
          this.wind = (Math.random() - 0.5) * 0.08;
          this.opacity = 0.14 + Math.random() * 0.28;
          this.twinkle = Math.random() * Math.PI * 2;
        }
        update() {
          this.y += this.speed * 0.55;
          this.x += this.wind * 0.35 + Math.sin(this.y * 0.004) * 0.08;
          this.twinkle += 0.04;
          this.opacity = 0.2 + Math.sin(this.twinkle) * 0.16;
          if (this.y > height + 20) { this.reset(); this.y = -10 - Math.random() * 40; }
          if (this.x < -20) this.x = width + 20;
          if (this.x > width + 20) this.x = -20;
        }
        draw(ctx) {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.twinkle);
          const s = this.size * 0.55;
          ctx.beginPath();
          for (let i = 0; i < 5; i++) {
            const angle = (i / 5) * Math.PI * 2 - Math.PI / 2;
            const x = Math.cos(angle) * s;
            const y = Math.sin(angle) * s;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
            const inner = angle + Math.PI / 5;
            ctx.lineTo(Math.cos(inner) * (s * 0.38), Math.sin(inner) * (s * 0.38));
          }
          ctx.closePath();
          ctx.fillStyle = `rgba(255,160,210,${this.opacity})`;
          ctx.fill();
          ctx.restore();
        }
      }

      for (let i = 0; i < MAX; i++) {
        const p = new Star();
        p.y = Math.random() * height;
        particles.push(p);
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);
        for (const p of particles) { p.update(); p.draw(ctx); }
        requestAnimationFrame(draw);
      }
      draw();
    })();

    // Improved soft hearts
    (function () {
      const canvas = document.getElementById('hearts-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width, height, hearts = [];
      const MAX = 28;

      function resize() {
        const box = document.getElementById('relationshipBox');
        if (!box) return;
        width = box.clientWidth;
        height = box.clientHeight;
        canvas.width = width;
        canvas.height = height;
      }

      class Heart {
        constructor() { this.reset(true); }
        reset(initial) {
          this.x = Math.random() * width;
          this.y = initial ? Math.random() * height : -30 - Math.random() * 50;
          this.size = 5 + Math.random() * 14;
          this.speed = 0.18 + Math.random() * 0.45;
          this.drift = (Math.random() - 0.5) * 0.4;
          this.opacity = 0.1 + Math.random() * 0.28;
          this.rot = Math.random() * Math.PI * 2;
          this.rotSpeed = (Math.random() - 0.5) * 0.03;
          this.pulse = Math.random() * Math.PI * 2;
          this.pulseSpeed = 0.02 + Math.random() * 0.03;
        }
        update() {
          this.y += this.speed;
          this.x += this.drift + Math.sin(this.y * 0.012) * 0.25;
          this.rot += this.rotSpeed;
          this.pulse += this.pulseSpeed;
          if (this.y > height + 40) this.reset(false);
        }
        draw(ctx) {
          const pulseScale = 1 + Math.sin(this.pulse) * 0.08;
          const s = (this.size / 16) * pulseScale;

          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rot);
          ctx.scale(s, s);

          ctx.shadowColor = 'rgba(255, 150, 200, 0.35)';
          ctx.shadowBlur = 8;

          ctx.beginPath();
          ctx.moveTo(0, 3);
          ctx.bezierCurveTo(-2, -2, -9, -2, -9, 3);
          ctx.bezierCurveTo(-9, 7, -4, 11, 0, 15);
          ctx.bezierCurveTo(4, 11, 9, 7, 9, 3);
          ctx.bezierCurveTo(9, -2, 2, -2, 0, 3);
          ctx.closePath();

          ctx.fillStyle = `rgba(255, 160, 210, ${this.opacity})`;
          ctx.fill();

          ctx.restore();
        }
      }

      function init() {
        resize();
        hearts = [];
        for (let i = 0; i < MAX; i++) hearts.push(new Heart());
      }

      function draw() {
        if (!canvas.width) return;
        ctx.clearRect(0, 0, width, height);
        for (const h of hearts) { h.update(); h.draw(ctx); }
        requestAnimationFrame(draw);
      }

      setTimeout(() => { init(); draw(); }, 100);
      window.addEventListener('resize', resize);
    })();

    // Intro + robust music start
    (function () {
      const intro = document.getElementById('intro-screen');
      const main = document.getElementById('mainWrapper');
      const music = document.getElementById('bgMusic');

      music.volume = 0.6;

      function tryPlay() {
        const p = music.play();
        if (p !== undefined) {
          p.catch(() => {}); // ignore rejection
        }
      }

      // Try immediately
      tryPlay();

      // Also try on any user interaction (browsers require this)
      const unlock = () => {
        tryPlay();
        document.removeEventListener('click', unlock);
        document.removeEventListener('touchstart', unlock);
        document.removeEventListener('keydown', unlock);
      };
      document.addEventListener('click', unlock);
      document.addEventListener('touchstart', unlock);
      document.addEventListener('keydown', unlock);

      // 1.5 second intro
      setTimeout(() => {
        intro.classList.add('fade-out');
        main.classList.add('visible');
        buildCalendar();
        startCounter();
        tryPlay(); // one more attempt after intro
      }, 1500);
    })();

    // Calendar
    function buildCalendar() {
      const grid = document.getElementById('calendarGrid');
      const now = new Date();
      const y = now.getFullYear();
      const m = now.getMonth();
      const first = new Date(y, m, 1);
      const last = new Date(y, m + 1, 0);
      const days = last.getDate();
      const start = first.getDay() === 0 ? 6 : first.getDay() - 1;

      let html = '';
      for (let i = 0; i < start; i++) html += '<div style="color:#3e2a36;">·</div>';

      for (let d = 1; d <= days; d++) {
        const isToday = d === now.getDate() && m === now.getMonth();
        const isSpecial = d === 13 && m === 7;
        if (isSpecial) {
          html += `<div class="special-date">${d}</div>`;
        } else {
          html += `<div style="color:${isToday ? '#f0d0e0' : '#907080'};font-weight:${isToday ? '400' : '200'};">${d}</div>`;
        }
      }
      grid.innerHTML = html;
    }

    // Live together counter — starts August 13, 2026
    function startCounter() {
      const start = new Date(2026, 7, 13, 0, 0, 0).getTime();

      function update() {
        const now = Date.now();
        let diff = Math.max(0, now - start);

        const days = Math.floor(diff / 86400000);
        diff %= 86400000;
        const hours = Math.floor(diff / 3600000);
        diff %= 3600000;
        const mins = Math.floor(diff / 60000);
        diff %= 60000;
        const secs = Math.floor(diff / 1000);

        document.getElementById('daysNum').textContent = days;
        document.getElementById('hoursNum').textContent = String(hours).padStart(2, '0');
        document.getElementById('minsNum').textContent = String(mins).padStart(2, '0');
        document.getElementById('secsNum').textContent = String(secs).padStart(2, '0');
      }

      update();
      setInterval(update, 1000);
    }

    // Sidebar nav
    (function () {
      const btns = document.querySelectorAll('.sidebar-btn');
      const sections = {
        relationship: document.getElementById('section-relationship'),
        calendar: document.getElementById('section-calendar'),
        together: document.getElementById('section-together')
      };
      btns.forEach(b => {
        b.addEventListener('click', function () {
          btns.forEach(x => x.classList.remove('active'));
          this.classList.add('active');
          const key = this.dataset.section;
          Object.keys(sections).forEach(k => sections[k].classList.toggle('hidden', k !== key));
        });
      });
    })();
  </script>
</body>
