<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>protected view</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    background: #0a0a0a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    position: relative;
  }
  #snowfall {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .snowflake {
    position: absolute;
    top: -10px;
    color: rgba(255,255,255,0.6);
    font-size: 14px;
    animation: fall linear infinite;
    opacity: 0.4;
    user-select: none;
    pointer-events: none;
  }
  @keyframes fall {
    0% { transform: translateY(-10px) rotate(0deg); opacity: 0.4; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0.1; }
  }
  .card {
    background: #141414;
    max-width: 560px;
    width: 90%;
    padding: 3rem 2.5rem;
    border-radius: 2rem;
    border: 1px solid #2a2a2a;
    box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.02);
    text-align: center;
    position: relative;
    z-index: 1;
    backdrop-filter: blur(2px);
  }
  h1 {
    color: #f0f0f0;
    font-weight: 300;
    font-size: 2.8rem;
    letter-spacing: 2px;
    margin-bottom: 0.5rem;
    text-shadow: 0 2px 10px rgba(255,255,255,0.05);
  }
  .animated-text {
    color: #bbbbbb;
    font-size: 1rem;
    font-weight: 300;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 2rem;
    animation: pulse 3s ease-in-out infinite;
    border-top: 1px solid #2a2a2a;
    border-bottom: 1px solid #2a2a2a;
    padding: 0.8rem 0;
    display: inline-block;
  }
  @keyframes pulse {
    0% { opacity: 0.4; letter-spacing: 3px; }
    50% { opacity: 1; letter-spacing: 6px; }
    100% { opacity: 0.4; letter-spacing: 3px; }
  }
  .status-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.8rem;
    margin: 2rem 0 1.5rem;
  }
  .status-item {
    background: #1a1a1a;
    padding: 0.9rem 0.3rem;
    border-radius: 1.2rem;
    border: 1px solid #282828;
  }
  .status-label {
    display: block;
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: #6a6a6a;
    margin-bottom: 0.3rem;
    font-weight: 400;
  }
  .status-value {
    font-weight: 500;
    font-size: 0.95rem;
    color: #d0d0d0;
    letter-spacing: 0.5px;
  }
  .status-value.ok { color: #8a8a8a; }
  .status-value.warn { color: #b0b0b0; }
  .status-value.block { color: #a0a0a0; }
  .status-value .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .dot.green { background: #6a6a6a; }
  .dot.yellow { background: #8a8a8a; }
  .dot.red { background: #7a7a7a; }
  .footnote {
    margin-top: 1.8rem;
    color: #3a3a3a;
    font-size: 0.7rem;
    letter-spacing: 1px;
    border-top: 1px solid #1f1f1f;
    padding-top: 1.5rem;
  }
  .footnote span {
    background: #1a1a1a;
    padding: 0.2rem 1rem;
    border-radius: 20px;
    color: #6a6a6a;
    border: 1px solid #242424;
  }
  .alert-banner {
    background: #1c1c1c;
    border-left: 3px solid #5a5a5a;
    color: #b0b0b0;
    padding: 0.6rem 1rem;
    border-radius: 0.8rem;
    margin-top: 1.2rem;
    font-size: 0.8rem;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    letter-spacing: 0.5px;
  }
  .alert-banner.show {
    display: flex;
  }
  .hidden {
    display: none;
  }
</style>
</head>
<body>

<div id="snowfall"></div>

<div class="card">
  <h1>secure view</h1>
  <div class="animated-text">integrity shield active</div>

  <div class="status-grid">
    <div class="status-item">
      <span class="status-label">adblock</span>
      <span class="status-value" id="adblockStatus"><span class="dot green"></span> clear</span>
    </div>
    <div class="status-item">
      <span class="status-label">devtools</span>
      <span class="status-value" id="devtoolsStatus"><span class="dot green"></span> closed</span>
    </div>
    <div class="status-item">
      <span class="status-label">source view</span>
      <span class="status-value" id="sourceStatus"><span class="dot green"></span> locked</span>
    </div>
    <div class="status-item">
      <span class="status-label">page save</span>
      <span class="status-value" id="downloadStatus"><span class="dot green"></span> blocked</span>
    </div>
  </div>

  <div id="alertBox" class="alert-banner">
    <span id="alertMessage">action prevented</span>
  </div>

  <div class="footnote">
    <span>protected environment</span>
  </div>
</div>

<script>
  (function() {
    "use strict";

    // ---- SNOWFALL ----
    (function createSnow() {
      const container = document.getElementById('snowfall');
      const flakes = ['•', '◦', '❄', '❅', '❆', '✦'];
      for (let i = 0; i < 65; i++) {
        const el = document.createElement('div');
        el.className = 'snowflake';
        el.textContent = flakes[Math.floor(Math.random() * flakes.length)];
        el.style.left = Math.random() * 100 + '%';
        el.style.fontSize = (6 + Math.random() * 16) + 'px';
        el.style.animationDuration = (8 + Math.random() * 18) + 's';
        el.style.animationDelay = (Math.random() * 15) + 's';
        el.style.opacity = 0.2 + Math.random() * 0.3;
        container.appendChild(el);
      }
    })();

    // ---- DOM REFS ----
    const adblockEl = document.getElementById('adblockStatus');
    const devtoolsEl = document.getElementById('devtoolsStatus');
    const sourceEl = document.getElementById('sourceStatus');
    const downloadEl = document.getElementById('downloadStatus');
    const alertBox = document.getElementById('alertBox');
    const alertMsg = document.getElementById('alertMessage');

    function setStatus(el, label, dotColor) {
      el.innerHTML = '<span class="dot ' + dotColor + '"></span> ' + label;
    }

    function showAlert(msg) {
      alertMsg.textContent = msg;
      alertBox.classList.add('show');
      setTimeout(() => {
        alertBox.classList.remove('show');
      }, 2600);
    }

    // ---- ADBLOCK ----
    (function detectAdBlock() {
      const bait = document.createElement('div');
      bait.className = 'adsbox ad ad-banner banner-ads';
      bait.style.cssText = 'position:absolute;left:-9999px;top:-9999px;height:1px;width:1px;';
      bait.innerHTML = '&nbsp;';
      document.body.appendChild(bait);

      const testAd = document.createElement('div');
      testAd.className = 'ad-unit ad-banner';
      testAd.style.cssText = 'position:absolute;left:-9999px;top:-9999px;height:1px;width:1px;';
      testAd.innerHTML = '&nbsp;';
      document.body.appendChild(testAd);

      const check = function() {
        let blocked = false;
        if (bait.offsetHeight === 0 || bait.offsetParent === null) blocked = true;
        else if (testAd.offsetHeight === 0 || testAd.offsetParent === null) blocked = true;
        else {
          const style = window.getComputedStyle(bait);
          if (style.display === 'none' || style.visibility === 'hidden') blocked = true;
        }
        if (blocked) {
          setStatus(adblockEl, 'detected', 'yellow');
          showAlert('adblocker detected');
        } else {
          setStatus(adblockEl, 'clear', 'green');
        }
        bait.remove();
        testAd.remove();
      };

      if (document.readyState === 'complete') check();
      else window.addEventListener('load', check);
    })();

    // ---- DEVTOOLS ----
    let devtoolsOpen = false;
    function devtoolsCheck() {
      const threshold = 160;
      const wDiff = window.outerWidth - window.innerWidth;
      const hDiff = window.outerHeight - window.innerHeight;
      const isOpen = (wDiff > threshold || hDiff > threshold);
      if (isOpen !== devtoolsOpen) {
        devtoolsOpen = isOpen;
        if (devtoolsOpen) {
          setStatus(devtoolsEl, 'open', 'yellow');
          showAlert('developer tools detected');
        } else {
          setStatus(devtoolsEl, 'closed', 'green');
        }
      }
    }
    setInterval(devtoolsCheck, 700);
    window.addEventListener('resize', devtoolsCheck);
    setTimeout(devtoolsCheck, 400);

    // ---- BLOCK CTRL+U ----
    document.addEventListener('keydown', function(e) {
      const key = e.key || e.keyCode;
      if (e.ctrlKey && (key === 'u' || key === 'U' || key === 85)) {
        e.preventDefault();
        e.stopPropagation();
        setStatus(sourceEl, 'blocked', 'red');
        showAlert('ctrl+u blocked');
        return false;
      }
      return true;
    }, true);

    // ---- BLOCK RIGHT CLICK ----
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      showAlert('right click blocked');
      return false;
    }, true);

    // ---- BLOCK F12 ----
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F12' || e.keyCode === 123) {
        e.preventDefault();
        setStatus(devtoolsEl, 'blocked', 'red');
        showAlert('f12 blocked');
        return false;
      }
    }, true);

    // ---- BLOCK SAVE SHORTCUTS ----
    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && (e.key === 's' || e.key === 'S' || e.keyCode === 83)) {
        e.preventDefault();
        setStatus(downloadEl, 'blocked', 'red');
        showAlert('ctrl+s blocked');
        return false;
      }
      if (e.ctrlKey && e.shiftKey && (e.key === 'S' || e.key === 's' || e.keyCode === 83)) {
        e.preventDefault();
        setStatus(downloadEl, 'blocked', 'red');
        showAlert('ctrl+shift+s blocked');
        return false;
      }
      if (e.ctrlKey && (e.key === 'p' || e.key === 'P' || e.keyCode === 80)) {
        e.preventDefault();
        setStatus(downloadEl, 'blocked', 'red');
        showAlert('ctrl+p blocked');
        return false;
      }
    }, true);

    // ---- BLOCK DRAG ----
    document.addEventListener('dragstart', function(e) {
      e.preventDefault();
      showAlert('drag blocked');
      return false;
    }, true);

    // ---- BLOCK DEVTOOLS SHORTCUTS ----
    document.addEventListener('keydown', function(e) {
      const ctrl = e.ctrlKey || e.metaKey;
      const shift = e.shiftKey;
      const key = e.key || e.keyCode;
      if (ctrl && shift && (key === 'i' || key === 'I' || key === 73)) {
        e.preventDefault();
        setStatus(devtoolsEl, 'blocked', 'red');
        showAlert('ctrl+shift+i blocked');
        return false;
      }
      if (ctrl && shift && (key === 'j' || key === 'J' || key === 74)) {
        e.preventDefault();
        setStatus(devtoolsEl, 'blocked', 'red');
        showAlert('ctrl+shift+j blocked');
        return false;
      }
      if (ctrl && shift && (key === 'c' || key === 'C' || key === 67)) {
        e.preventDefault();
        setStatus(devtoolsEl, 'blocked', 'red');
        showAlert('ctrl+shift+c blocked');
        return false;
      }
    }, true);

    // ---- BLOCK COPY/CUT ----
    document.addEventListener('copy', function(e) {
      e.preventDefault();
      showAlert('copy blocked');
      return false;
    }, true);
    document.addEventListener('cut', function(e) {
      e.preventDefault();
      showAlert('cut blocked');
      return false;
    }, true);

    // ---- BEFOREUNLOAD (source download attempt) ----
    window.addEventListener('beforeunload', function(e) {
      if (devtoolsOpen) {
        setStatus(downloadEl, 'attempted', 'yellow');
        showAlert('source download attempt');
      }
    });

    // ---- INIT STATUS ----
    setStatus(adblockEl, 'clear', 'green');
    setStatus(devtoolsEl, 'closed', 'green');
    setStatus(sourceEl, 'locked', 'green');
    setStatus(downloadEl, 'blocked', 'green');

    setTimeout(devtoolsCheck, 500);

    // console override to prevent easy source inspection
    console.log = function() {};
    console.warn = function() {};
    console.error = function() {};
    console.table = function() {};
    console.group = function() {};
    console.groupEnd = function() {};

    // ---- PREVENT SELECTION ----
    document.addEventListener('selectstart', function(e) {
      e.preventDefault();
      return false;
    }, true);

    // ---- BLOCK VIEW SOURCE VIA DRAG TO ADDRESS BAR ----
    document.addEventListener('drop', function(e) {
      e.preventDefault();
      showAlert('drop blocked');
      return false;
    }, true);
    document.addEventListener('dragover', function(e) {
      e.preventDefault();
      return false;
    }, true);

  })();
</script>
</body>
</html>
